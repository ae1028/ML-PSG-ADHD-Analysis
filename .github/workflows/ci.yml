name: Repository Validation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.9 validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9.19
        uses: actions/setup-python@v5
        with:
          python-version: "3.9.19"
          cache: "pip"

      - name: Show Python version
        run: python --version

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install project
        run: python -m pip install -e .

      - name: Run repository integrity validation
        run: python scripts/validate_repository.py

      - name: Run automated tests
        run: python -m pytest -q

      - name: Check feature-extraction CLI
        run: python scripts/extract_features.py --help

      - name: Check modeling CLI
        run: python scripts/run_modeling.py --help

      - name: Check synthetic PSG CLI
        run: python scripts/generate_synthetic_psg.py --help

      - name: Check synthetic demo CLI
        run: python scripts/run_synthetic_demo.py --help