[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-psg-adhd-analysis"
version = "0.1.0"
description = "Graph-based machine learning for sleep-stage-specific polysomnography analysis in ADHD research."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

dependencies = [
    "mne==1.6.1",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "networkx==3.2.1",
    "matplotlib==3.8.4",
    "seaborn==0.13.2",
    "scikit-learn==1.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]